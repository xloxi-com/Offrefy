# Fetch target: only when metafield rule_source.mode = "api" (catalog exceeds metafield shards).
# Requires network_access capability (Shopify Plus / approved custom apps).
query FetchInput {
  cart {
    vdLockedProductsAttr: attribute(key: "vd_locked_products") {
      value
    }
    lines {
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
    campaignsFrag0: metafield(namespace: "volume_discount", key: "campaigns") {
      jsonValue
    }
  }
}
