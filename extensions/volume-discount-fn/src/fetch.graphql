# Fetch builds a network request whenever rule_source.shopDomain is set
# (gap-fill for products whose volume_discount.tiers metafield is empty).
query FetchInput {
  cart {
    vdLockedProductsAttr: attribute(key: "vd_locked_products") {
      value
    }
    lines {
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
