# Fetch only builds a network request when rule_source.mode = "api".
query FetchInput {
  cart {
    vdLockedProductsAttr: attribute(key: "vd_locked_products") {
      value
    }
    lines {
      merchandise {
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
