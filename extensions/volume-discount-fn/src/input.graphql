# Metafield-only cart discount input (no fetchResult — avoids fuel burn).
query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            tiersMetafield: metafield(namespace: "volume_discount", key: "tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
  }
}
