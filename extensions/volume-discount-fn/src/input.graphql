# Metafield-only cart discount input (no fetchResult — avoids fuel burn).
# ruleSource.w = compact "all products" wildcard when product tiers MF is missing.
# $customerSegmentTags comes from discount metafield volume_discount.input_variables
# (union of tags from active logged-in-tag-any campaigns).
query CartInput($customerSegmentTags: [String!] = []) {
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        hasTags(tags: $customerSegmentTags) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            tiersMetafield: metafield(namespace: "volume_discount", key: "tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
