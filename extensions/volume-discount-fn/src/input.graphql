# Slim cart lines (no per-product metafield). Copying tiers JSON onto every
# line burned the ~11M instruction budget around 40 lines and failed the run.
# Rules are one discount metafield: rule_source.w (all products) and
# rule_source.p (product id → rule). The run skips cart lines after the first 39.
# $customerSegmentTags comes from discount metafield volume_discount.input_variables
# (union of tags from active logged-in-tag-any campaigns).
query CartInput($customerSegmentTags: [String!] = []) {
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        hasTags(tags: $customerSegmentTags) {
          tag
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
