# Slim input — product tiers metafields only. Avoid loading large discount
# campaign JSON here (that alone can push a large cart over the instruction budget).
query CartInput {
  cart {
    vdLockedProductsAttr: attribute(key: "vd_locked_products") {
      value
    }
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          product {
            id
            tiersMetafield: metafield(namespace: "volume_discount", key: "tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  fetchResult {
    status
    body
  }
  discount {
    discountClasses
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
