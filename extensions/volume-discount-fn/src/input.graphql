# Slim input — product tiers metafields + line cost (needed for fixed-price /
# amount-off calculations). Avoid loading large campaign JSON here.
query CartInput {
  cart {
    vdLockedProductsAttr: attribute(key: "vd_locked_products") {
      value
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            tiersMetafield: metafield(namespace: "volume_discount", key: "tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  fetchResult {
    status
    body
  }
  discount {
    discountClasses
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
