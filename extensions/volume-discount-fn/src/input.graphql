# Metafield-only cart discount input (no fetchResult — avoids fuel burn).
# ruleSource.w = compact "all products" wildcard when product tiers MF is missing.
query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            id
            tiersMetafield: metafield(namespace: "volume_discount", key: "tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
  discount {
    discountClasses
    ruleSource: metafield(namespace: "volume_discount", key: "rule_source") {
      jsonValue
    }
  }
}
