    <path d="M160 76 V42 Q160 30 178 30 Q196 30 196 42 V76 Z"/>
    <circle cx="178" cy="26" r="10"/>
    <!-- Right minaret -->
    <rect x="208" y="22" width="6" height="54" rx="1.2"/>
    <rect x="205.5" y="18" width="11" height="4.5" rx="1"/>
    <path d="M211 6 L214.5 18 H207.5 Z"/>
    <!-- Far right small -->
    <path d="M228 76 V48 Q228 38 242 38 Q256 38 256 48 V76 Z"/>
    <circle cx="242" cy="34" r="8"/>
    <rect x="268" y="30" width="5.5" height="46" rx="1"/>
    <path d="M270.75 16 L274 30 H267.5 Z"/>
    <path d="M286 76 V50 Q286 42 298 42 Q310 42 310 50 V76 Z"/>
    <circle cx="298" cy="38" r="7"/>
