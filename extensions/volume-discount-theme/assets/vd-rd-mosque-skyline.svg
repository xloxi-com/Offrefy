<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none" aria-hidden="true">
  <!-- Soft mosque skyline — gold silhouette, transparent -->
  <defs>
    <linearGradient id="rdSkyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a6a18" stop-opacity="0.32"/>
    </linearGradient>
  </defs>
  <g fill="url(#rdSkyG)">
    <!-- Far left minaret -->
    <rect x="12" y="28" width="6" height="48" rx="1.2"/>
    <rect x="9.5" y="24" width="11" height="4.5" rx="1"/>
    <path d="M15 10 L18.5 24 H11.5 Z"/>
    <!-- Left dome building -->
    <path d="M28 76 V44 Q28 32 44 32 Q60 32 60 44 V76 Z"/>
