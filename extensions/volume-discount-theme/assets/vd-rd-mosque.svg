  <path d="M36 30 C36 26 39 24 42 24 C45 24 48 26 48 30" fill="url(#rdMosGold)"/>
  <!-- Arches -->
  <path d="M22 52 V42 Q22 36 32 36 Q42 36 42 42 V52" fill="#6b1d1e" opacity="0.75"/>
  <path d="M17 52 V46 Q17 42 20 42 Q23 42 23 46 V52" fill="#6b1d1e" opacity="0.45"/>
  <path d="M41 52 V46 Q41 42 44 42 Q47 42 47 46 V52" fill="#6b1d1e" opacity="0.45"/>
