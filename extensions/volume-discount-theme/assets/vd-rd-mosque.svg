<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" fill="none" aria-hidden="true">
  <!-- Clean mosque icon — gold domes, cream body -->
  <defs>
    <linearGradient id="rdMosGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="rdMosBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ee"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
  </defs>
  <!-- Left minaret -->
  <rect x="6" y="22" width="6" height="30" rx="1.2" fill="url(#rdMosBody)" stroke="#c9a227" stroke-width="1"/>
  <rect x="4.5" y="19" width="9" height="4" rx="1" fill="url(#rdMosGold)"/>
  <path d="M9 8 L12.5 19 H5.5 Z" fill="url(#rdMosGold)"/>
  <!-- Right minaret -->
  <rect x="52" y="22" width="6" height="30" rx="1.2" fill="url(#rdMosBody)" stroke="#c9a227" stroke-width="1"/>
  <rect x="50.5" y="19" width="9" height="4" rx="1" fill="url(#rdMosGold)"/>
  <path d="M55 8 L58.5 19 H51.5 Z" fill="url(#rdMosGold)"/>
