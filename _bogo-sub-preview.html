<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/extensions/volume-discount-theme/assets/volume-discount-storefront.css" />
  <style>body{margin:24px;background:#fff}.frame{width:420px}</style>
</head>
<body>
  <div class="frame"><div data-offrefy-root>
    <div class="offrefy-bogo" style="--ob-badge-bg:#6b1d1e;--ob-badge-text:#fff;--ob-ink:#1c1917;--ob-muted:#78716c;--ob-line:#eadfde">
      <div class="offrefy-bogo__hero">
        <div class="offrefy-bogo__hero-copy">
          <div class="offrefy-bogo__title">Buy 5, get 1 free</div>
          <div class="offrefy-bogo__badge"><span>Special Offer</span></div>
        </div>
        <p class="offrefy-bogo__sub" id="sub">Buy Boga Pack de 6 x 1,5L x 84 (FR) and get a free gift of your choice. Extra words keep going so a fourth line would appear if the clamp failed and the text ran under the badge.</p>
      </div>
    </div>
  </div></div>
  <p id="out"></p>
  <script>
    const sub = document.getElementById("sub");
    const badge = document.querySelector(".offrefy-bogo__badge");
    const s = getComputedStyle(sub);
    const line = parseFloat(s.lineHeight) || 18;
    const lines = Math.round(sub.getBoundingClientRect().height / line);
    const overlap = sub.getBoundingClientRect().right > badge.getBoundingClientRect().left + 1;
    document.getElementById("out").textContent =
      "lines:" + lines + " clamp:" + s.webkitLineClamp + " overlap:" + overlap;
  </script>
</body>
</html>
