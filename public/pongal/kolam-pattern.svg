<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Light Tamil pulli-kolam tile -->
  <g fill="#9a3412" opacity="0.1">
    <circle cx="30" cy="30" r="1.8"/>
    <circle cx="90" cy="30" r="1.8"/>
    <circle cx="30" cy="90" r="1.8"/>
    <circle cx="90" cy="90" r="1.8"/>
    <circle cx="60" cy="60" r="2"/>
    <circle cx="60" cy="0" r="1.5"/><circle cx="60" cy="120" r="1.5"/>
    <circle cx="0" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/>
    <circle cx="0" cy="0" r="1.5"/><circle cx="120" cy="0" r="1.5"/>
    <circle cx="0" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.12">
    <!-- loops around each pulli -->
    <circle cx="30" cy="30" r="14"/>
    <circle cx="90" cy="30" r="14"/>
    <circle cx="30" cy="90" r="14"/>
    <circle cx="90" cy="90" r="14"/>
    <circle cx="60" cy="60" r="16"/>
    <!-- soft diamond lattice -->
    <path d="M30 30 L60 60 L90 30"/>
    <path d="M30 90 L60 60 L90 90"/>
    <!-- petal arcs at center -->
    <path d="M60 44c8 0 12 6 12 16s-4 16-12 16-12-6-12-16 4-16 12-16z"/>
  </g>
</svg>
