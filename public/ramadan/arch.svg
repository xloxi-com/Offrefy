  />
  <!-- Keystone ornament -->
  <circle cx="140" cy="10" r="3.2" fill="#c9a227" opacity="0.9"/>
  <path d="M140 4 L143.2 9.5 L140 8.2 L136.8 9.5 Z" fill="#e8c547"/>
