<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none" aria-hidden="true">
  <!-- Soft Islamic iwan / portal arch — gold outline, transparent -->
  <defs>
    <linearGradient id="rdArchGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="55%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a67c0a"/>
    </linearGradient>
  </defs>
  <!-- Outer arch -->
  <path
    d="M18 88 V42 C18 18 52 4 140 4 C228 4 262 18 262 42 V88"
    stroke="url(#rdArchGold)"
