<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" aria-hidden="true">
  <!-- Clean suhoor dates cluster — warm brown + gold stem -->
  <defs>
    <linearGradient id="rdDateA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="rdDateB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="rdDateGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
  </defs>
  <!-- Stem / rachis -->
  <path d="M28 6 C28 6 30 18 28 26" stroke="url(#rdDateGold)" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 14 C22 16 16 22 14 30" stroke="url(#rdDateGold)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M28 16 C34 18 40 24 42 32" stroke="url(#rdDateGold)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Dates -->
  <ellipse cx="16" cy="36" rx="7" ry="10" fill="url(#rdDateA)" transform="rotate(-18 16 36)"/>
  <ellipse cx="28" cy="40" rx="7.5" ry="11" fill="url(#rdDateB)"/>
  <ellipse cx="40" cy="36" rx="7" ry="10" fill="url(#rdDateA)" transform="rotate(18 40 36)"/>
  <!-- Soft highlights -->
  <ellipse cx="14" cy="32" rx="2" ry="3.5" fill="#f5e6b8" opacity="0.28" transform="rotate(-18 14 32)"/>
  <ellipse cx="26" cy="35" rx="2.2" ry="4" fill="#f5e6b8" opacity="0.28"/>
  <ellipse cx="38" cy="32" rx="2" ry="3.5" fill="#f5e6b8" opacity="0.28" transform="rotate(18 38 32)"/>
</svg>
