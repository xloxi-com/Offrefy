# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5bc674730835cd4d44ce63b0da5cbd59"
name = "Offrefy"
application_url = "https://offrey.xloxi.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_discounts,write_discounts,read_products,write_products,read_locales,read_themes,read_orders,write_pixels,read_customer_events"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://offrey.xloxi.com/auth/callback" ]

[app_proxy]
url = "https://offrey.xloxi.com"
subpath = "volume-discount"
prefix = "apps"
